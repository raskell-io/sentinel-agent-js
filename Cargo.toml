[package]
name = "zentinel-agent-js"
version = "0.2.0"
edition = "2021"
rust-version = "1.94.1"
authors = ["Zentinel Contributors"]
license = "Apache-2.0"
repository = "https://github.com/zentinelproxy/zentinel-agent-js"
homepage = "https://zentinelproxy.io"
documentation = "https://zentinelproxy.io/docs/agents/js"
description = "JavaScript scripting agent for Zentinel reverse proxy - embed custom JS logic"
keywords = ["proxy", "reverse-proxy", "agent", "javascript", "scripting"]
categories = ["network-programming"]
readme = "README.md"

[lib]
name = "zentinel_agent_js"
path = "src/lib.rs"

[[bin]]
name = "zentinel-js-agent"
path = "src/main.rs"

[dependencies]
# Zentinel protocol
zentinel-agent-protocol = "0.6"
zentinel-common = "0.5"

# Async runtime
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"

# JavaScript engine (QuickJS - fast, lightweight)
rquickjs = { version = "0.8", features = ["bindgen", "classes", "loader", "macro", "parallel"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Command line
clap = { version = "4.5", features = ["derive", "env"] }

[dev-dependencies]
tempfile = "3.12"
uuid = { version = "1.10", features = ["v4"] }
